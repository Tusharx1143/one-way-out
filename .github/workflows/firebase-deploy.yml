name: CI/CD - One Way Out

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['master', 'develop']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci:
    name: 🧪 CI Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install
        run: npm ci

      - name: 🔐 Secret Scan (Gitleaks)
        run: |
          docker run --rm \
            -v $(pwd):/repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source="/repo" \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif || true

          # fallback if empty
          if [ ! -s gitleaks.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > gitleaks.sarif
          fi

      - name: 📤 Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif

      - name: 🛡️ npm Audit
        run: npm audit --audit-level=high

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test


  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: ci
    environment: CI/CD
    permissions:
      contents: read

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/Release-'))

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build App
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 📦 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1


  deploy_preview:
    name: 🌐 Preview Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: CI/CD
    permissions:
      contents: read

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v7

      - name: 📦 Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔐 Validate Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONE_WAY_OUT }}" ]; then
            echo "❌ Firebase secret missing"
            exit 1
          fi

      - name: 🔐 Auth Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONE_WAY_OUT }}'

      - name: 🚀 Deploy Preview
        run: |
          CHANNEL_ID=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          npx firebase-tools hosting:channel:deploy $CHANNEL_ID \
            --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
            --expires 7d \
            --non-interactive


  deploy_production:
    name: 🚀 Production Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: CI/CD
    permissions:
      contents: read

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Release-')

    steps:
      - uses: actions/checkout@v7

      - name: 📦 Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔐 Validate Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONE_WAY_OUT }}" ]; then
            echo "❌ Firebase secret missing"
            exit 1
          fi

      - name: 🔐 Auth Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONE_WAY_OUT }}'

      - name: 🚀 Deploy Production
        run: |
          npx firebase-tools deploy \
            --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
            --non-interactive --force
